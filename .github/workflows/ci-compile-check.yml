name: 'CI compile check'

# Compile-only verification. Unlike deploy.yml (workflow_dispatch, builds
# installers and publishes a GitHub release), this fires automatically on every
# push and pull request and only compiles the client on Linux — no installer
# packaging, no release side effects. Gives changes a real build check.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-Linux-Ubuntu:
    runs-on: ubuntu-latest

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.26.2"

    - name: 'Install system packages'
      run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev ninja-build

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Build project (compile check, no installer)'
      shell: bash
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: deploy/build.sh --generator Ninja
